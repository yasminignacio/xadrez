<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabalho Acadêmico: Cyber Runner 2D</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-container">
        <header>
            <h1>Neon Cyber Runner</h1>
            <div id="hud">
                <div>Pontuação: <strong id="score-val">0</strong></div>
                <div>Recorde: <strong id="highscore-val">0</strong></div>
            </div>
        </header>

        <!-- Tela de pintura gráfica -->
        <canvas id="runnerCanvas" width="700" height="300"></canvas>

        <footer>
            <p><strong>Controles:</strong> Pressione a tecla <strong>ESPAÇO</strong> ou a <strong>SETA PARA CIMA</strong> para pular.</p>
        </footer>
    </div>

    <script src="game.js"></script>
</body>
</html>
