<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabalho Prático: Tower Defense Game</title>
    <!-- Vinculação do arquivo CSS separado -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-container">
        <header>
            <h1>Defesa de Torre - Projeto de Game</h1>
            <div id="hud">
                <div class="hud-item">Vida: <span id="life-val">20</span></div>
                <div class="hud-item">Ouro: $<span id="gold-val">150</span></div>
                <div class="hud-item">Onda: <span id="wave-val">1</span></div>
            </div>
        </header>

        <!-- Tela de renderização gráfica do jogo -->
        <canvas id="gameCanvas" width="800" height="400"></canvas>

        <footer>
            <p><strong>Instruções:</strong> Clique em qualquer lugar cinza do mapa para construir uma torre por <strong>$50</strong>.</p>
        </footer>
    </div>

    <!-- Vinculação do arquivo JavaScript separado -->
    <script src="game.js"></script>
</body>
</html>
