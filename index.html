<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma Arcade - Phaser 3</title>
    <style>
        body {
            margin: 0;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
    </style>
    <!-- Importando a biblioteca Phaser 3 via CDN -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>

<script>
    const config = {
        type: Phaser.AUTO,
        width: 800,
        height: 600,
        physics: {
            default: 'arcade',
            arcade: {
                gravity: { y: 300 },
                debug: false
            }
        },
        scene: {
            preload: preload,
            create: create,
            update: update
        }
    };

    const game = new Phaser.Game(config);
    let player;
    let platforms;
    let cursors;
    let stars;
    let score = 0;
    let scoreText;
    let bombs;
    let gameOver = false;

    function preload() {
        // Carregando imagens baseadas em formas geométricas nativas para funcionar sem arquivos externos
        this.load.image('sky', 'https://phaser.io');
        this.load.image('ground', 'https://phaser.io');
        this.load.image('star', 'https://phaser.io');
        this.load.image('bomb', 'https://phaser.io');
        this.load.spritesheet('dude', 'https://phaser.io', { frameWidth: 32, frameHeight: 48 });
    }

    function create() {
        // Fundo do cenário
        this.add.image(400, 300, 'sky');

        // Grupo de plataformas com física estática (não se movem)
        platforms = this.physics.add.staticGroup();

        // Chão principal e plataformas flutuantes
        platforms.create(400, 568, 'ground').setScale(2).refreshBody();
        platforms.create(600, 400, 'ground');
        platforms.create(50, 250, 'ground');
        platforms.create(750, 220, 'ground');

        // Configuração do Jogador (Sprite + Física Dinâmica)
        player = this.physics.add.sprite(100, 450, 'dude');
        player.setBounce(0.2); // Pequeno quique ao cair
        player.setCollideWorldBounds(true); // Não sair da tela

        // Animações do Jogador
        this.anims.create({
            key: 'left',
            frames: this.anims.generateFrameNumbers('dude', { start: 0, end: 3 }),
            frameRate: 10,
            repeat: -1
        });

        this.anims.create({
            key: 'turn',
            frames: [ { key: 'dude', frame: 4 } ],
            frameRate: 20
        });

        this.anims.create({
            key: 'right',
            frames: this.anims.generateFrameNumbers('dude', { start: 5, end: 8 }),
            frameRate: 10,
            repeat: -1
        });

        // Controles do teclado
        cursors = this.input.keyboard.createCursorKeys();

        // Grupo de Itens Colecionáveis (Estrelas)
        stars = this.physics.add.group({
            key: 'star',
            repeat: 11,
            setXY: { x: 12, y: 0, stepX: 70 }
        });

        stars.children.iterate(function (child) {
            // Efeito de quique aleatório para cada estrela
            child.setBounceY(Phaser.Math.FloatBetween(0.4, 0.8));
            child.setScale(0.5);
        });

        // Inimigos (Bombas)
        bombs = this.physics.add.group();

        // Texto do Placar
        scoreText = this.add.text(16, 16, 'Pontos: 0', { fontSize: '32px', fill: '#fff', fontFamily: 'sans-serif' });

        // Adicionando colisões no motor físico
        this.physics.add.collider(player, platforms);
        this.physics.add.collider(stars, platforms);
        this.physics.add.collider(bombs, platforms);

        // Checar sobreposição (Overlap) para coletar itens ou morrer
        this.physics.add.overlap(player, stars, collectStar, null, this);
        this.physics.add.collider(player, bombs, hitBomb, null, this);
    }

    function update() {
        if (gameOver) {
            return;
        }

        // Movimentação Esquerda / Direita
        if (cursors.left.isDown) {
            player.setVelocityX(-160);
            player.anims.play('left', true);
        } else if (cursors.right.isDown) {
            player.setVelocityX(160);
            player.anims.play('right', true);
        } else {
            player.setVelocityX(0);
            player.anims.play('turn');
        }

        // Pular (Apenas se estiver tocando no chão ou plataforma)
        if (cursors.up.isDown && player.body.touching.down) {
            player.setVelocityY(-330);
        }
    }

    function collectStar(player, star) {
        star.disableBody(true, true); // Remove a estrela da tela

        score += 10;
        scoreText.setText('Pontos: ' + score);

        // Se coletar todas as estrelas, cria uma nova leva e joga uma bomba na tela
        if (stars.countActive(true) === 0) {
            stars.children.iterate(function (child) {
                child.enableBody(true, child.x, 0, true, true);
            });

            // Evita que a bomba caia direto na cabeça do jogador
            const x = (player.x < 400) ? Phaser.Math.Between(400, 800) : Phaser.Math.Between(0, 400);

            const bomb = bombs.create(x, 16, 'bomb');
            bomb.setBounce(1);
            bomb.setCollideWorldBounds(true);
            bomb.setVelocity(Phaser.Math.Between(-200, 200), 200);
        }
    }

    function hitBomb(player, bomb) {
        this.physics.pause();
        player.setTint(0xff0000);
        player.anims.play('turn');
        gameOver = true;
        
        this.add.text(300, 250, 'GAME OVER', { fontSize: '48px', fill: '#ff0000', fontWeight: 'bold' });
    }
</script>

</body>
</html>
