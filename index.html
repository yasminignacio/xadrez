<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabalho Prático: Text RPG Dungeon</title>
    <!-- Vinculação do arquivo CSS separado -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-container">
        <header>
            <h1>As Catacumbas de Eldoria</h1>
            <!-- Painel de Atributos do Jogador -->
            <div id="stats-panel">
                <span>Vida: <strong id="hp-val">100</strong>/100</span> | 
                <span>Ouro: $<strong id="gold-val">0</strong></span> | 
                <span>Arma: <strong id="weapon-val">Adaga de Ferro</strong></span>
            </div>
        </header>

        <!-- Caixa de Texto Dinâmica da História -->
        <main id="story-box">
            Carregando a jornada...
        </main>

        <!-- Container de Botões de Escolha -->
        <footer id="choices-panel">
            <!-- Os botões serão injetados aqui pelo JavaScript -->
        </footer>
    </div>

    <!-- Vinculação do arquivo JavaScript separado -->
    <script src="game.js"></script>
</body>
</html>
