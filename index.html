<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabalho Acadêmico: Xadrez Canvas 2D</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-container">
        <header>
            <h1>Xadrez Acadêmico</h1>
            <div id="hud">
                Turno: <strong id="turn-val">Brancas</strong>
            </div>
        </header>

        <!-- Canvas onde o tabuleiro e as peças são desenhados -->
        <canvas id="chessCanvas" width="480" height="480"></canvas>

        <footer>
            <p id="log-box">Clique em uma peça para selecionar, depois no destino para mover.</p>
        </footer>
    </div>

    <script src="game.js"></script>
</body>
</html>
